name: 🐛 Bug Report
description: Create a report to help us improve Antigravity Operator
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much context as possible.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: input
    id: agyo-version
    attributes:
      label: agyo version
      description: Run `agyo version` and paste the output here.
      placeholder: agyo (Antigravity Operator) v0.4.1 [darwin/arm64]
    validations:
      required: true
  - type: textarea
    id: doctor-output
    attributes:
      label: agyo doctor output
      description: Paste the output of `agyo doctor` to help us diagnose your host environment.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running?
      options:
        - macOS (Apple Silicon - M1/M2/M3/M4)
        - macOS (Intel - x86_64)
        - Linux Desktop (Ubuntu/Debian)
        - Linux Desktop (Fedora/Arch/Other)
        - Linux Server / VPS (Headless / Docker)
        - Windows (WSL2)
    validations:
      required: true
