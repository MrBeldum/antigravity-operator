name: 💡 Feature Request
description: Suggest an idea or new capability for Antigravity Operator
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome ideas for new outer harness sensors, student skills, and developer workflows!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: harness-context
    attributes:
      label: Harness Category (Martin Fowler Outer Harness Model)
      description: How does this map to the Guia (feedforward) or Sensor (feedback) loop?
      placeholder: "Sensor: auditar runtime... / Guia: novo template..."
    validations:
      required: false
